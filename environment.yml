# micromamba env create -f environment.yml
# table2asn is not on conda-forge/bioconda; take it from
# https://ftp.ncbi.nlm.nih.gov/asn1-converters/by_program/table2asn/
name: ibv_asm
channels: [conda-forge, bioconda]
dependencies:
  - python=3.11
  - fastp=1.3.7
  - megahit=1.2.9
  - minimap2=2.31
  - bwa-mem2=2.2.1
  - samtools=1.24
  - bcftools=1.24
  - seqkit=2.13.0
  - kraken2=2.17.1
  - mafft=7.407
  - trimal=1.5
  - iqtree=3.1.3
  - biopython
  - matplotlib
